<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>和他說說話</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC&display=swap">
<style>
/* Layout: he stands full height on the left (or fills the phone), the conversation sits beside or over him */
:root {
  --bg: #1f160f;
  --bg-2: #2b1f16;
  --ink: #f3e6d0;
  --ink-soft: #c9b799;
  --muted: #a8957a;
  --gold: #a9834a;
  --gold-soft: #d9c08e;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --hand: "LXGW WenKai TC", "Noto Serif TC", "Kaiti TC", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse at 40% 30%, var(--bg-2), var(--bg) 70%); background-color: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 16px; line-height: 1.8; overflow: hidden; }
.room { height: 100dvh; display: grid; grid-template-columns: auto minmax(0, 420px); gap: 40px; align-items: center; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 0; }
.stage { position: relative; height: 100dvh; aspect-ratio: 9/16; max-width: 100vw; overflow: hidden; background: #1e150e url(../avatar/idle.jpg) center/cover; }
.stage video { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .35s; }
.stage .talk, .stage .bow { opacity: 0; }
.stage.speaking .talk, .stage.bowing .bow { opacity: 1; }
.stage.speaking .idle, .stage.bowing .idle { opacity: 0; }
.cap { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 56px 18px 24px; background: linear-gradient(0deg, rgba(20,13,8,.82), transparent); font-family: var(--hand); font-size: clamp(1.15rem, 2.6vh, 1.7rem); line-height: 1.6; text-align: center; color: #fff6e6; text-shadow: 0 1px 6px rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; min-height: 5.4em; opacity: 0; transition: opacity .3s; }
.cap.on { opacity: 1; }
.fs { position: absolute; z-index: 4; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,243,220,.4); background: rgba(20,13,8,.45); color: #fff6e6; font: inherit; font-size: .82rem; letter-spacing: .1em; cursor: pointer; backdrop-filter: blur(4px); }
.fs svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: center; max-height: 100dvh; overflow-y: auto; padding-block: 24px; }
.eyebrow { color: var(--gold); letter-spacing: .3em; font-size: .78rem; }
h1 { margin: -6px 0 0; font-size: clamp(1.5rem, 3.4vw, 2rem); font-weight: 600; letter-spacing: .14em; }
.lead { margin: 0; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button, .more { font: inherit; font-size: .92rem; padding: 6px 14px; border-radius: 99px; border: 1px solid rgba(217,192,142,.45); background: rgba(255,243,220,.06); color: var(--ink); cursor: pointer; }
.chips button:hover, .chips button:focus-visible { border-color: var(--gold-soft); background: rgba(255,243,220,.14); outline: none; }
.more { justify-self: start; border-style: dashed; color: var(--gold-soft); }
.say { display: flex; gap: 8px; }
.say input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; color: #fff6e6; background: rgba(255,243,220,.08); border: 1px solid rgba(217,192,142,.4); border-radius: 10px; padding: 10px 12px; }
.say input::placeholder { color: var(--muted); }
.say input:focus { outline: 2px solid var(--gold-soft); border-color: var(--gold); }
.btn { font: inherit; letter-spacing: .15em; padding: 10px 22px; border-radius: 99px; border: 1px solid var(--gold); background: var(--gold); color: #fffaf2; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--gold-soft); border-color: var(--gold-soft); padding: 6px 18px; font-size: .9rem; }
.mic { flex: none; width: 48px; border-radius: 50%; border: 1px solid var(--gold-soft); background: transparent; cursor: pointer; display: grid; place-items: center; }
.mic svg { width: 22px; height: 22px; fill: none; stroke: var(--gold-soft); stroke-width: 1.6; }
.mic.rec { background: #a94a3a; border-color: #a94a3a; animation: pulse 1.2s infinite; }
.mic.rec svg { stroke: #fff; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(169,74,58,.25); } }
.status { display: flex; gap: 12px; align-items: center; min-height: 2.2em; }
.you { flex: 1; margin: 0; font-size: .92rem; color: var(--gold-soft); }
.note { margin: 0; font-size: .8rem; color: var(--muted); }
.busy .chips button, .busy .say > * { opacity: .5; pointer-events: none; }
/* Phones and portrait screens: he fills the screen, the chat floats over the bottom */
@media (max-width: 760px), (max-aspect-ratio: 4/5) {
  .room { display: block; padding: 0; }
  .stage { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; }
  .cap { bottom: var(--panel, 170px); padding-bottom: 12px; background: none; min-height: 0; }
  .side { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; max-height: none; overflow: visible; gap: 10px; padding: 40px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(0deg, rgba(20,13,8,.94) 62%, rgba(20,13,8,0)); }
  .eyebrow, h1, .lead, .note, .more { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; background: rgba(20,13,8,.55); }
  .chips button[hidden] { display: inline-block !important; }
}
/* Start veil: shown only when the browser needs one tap before sound and mic */
.veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; align-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(20,13,8,.55); color: #fff6e6; cursor: pointer; border: 0; font: inherit; width: 100%; }
.veil b { font-family: var(--hand); font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 400; letter-spacing: .12em; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.veil span { font-size: .95rem; color: var(--gold-soft); letter-spacing: .15em; }
.veil i { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--gold-soft); display: grid; place-items: center; animation: pulse 1.8s infinite; }
.veil svg { width: 30px; height: 30px; fill: none; stroke: var(--gold-soft); stroke-width: 1.6; }
.vbtn { right: auto; left: 12px; }
.pres { right: auto; left: 12px; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 44px); font-size: .78rem; letter-spacing: .06em; }
.pres i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pres.seen i { background: #7fbf7a; box-shadow: 0 0 0 4px rgba(127,191,122,.25); }
.pres.off { opacity: .6; }
/* Voice picker: a quiet sheet listing the voices the family opened up */
.vpanel { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 16px; background: rgba(20,13,8,.6); }
.vpanel > div { width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--bg-2); border: 1px solid rgba(217,192,142,.35); border-radius: 14px; padding: 18px 18px 14px; display: grid; gap: 10px; }
.vpanel h2 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: .12em; }
.vpanel h3 { margin: 8px 0 0; font-size: .85rem; letter-spacing: .2em; color: var(--gold); font-weight: 400; }
.vopt { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(217,192,142,.2); }
.vopt.cur { border-color: var(--gold-soft); background: rgba(255,243,220,.07); }
.vopt b { font-weight: 600; letter-spacing: .06em; }
.vopt small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.5; }
.vopt .btn { padding: 5px 14px; font-size: .85rem; letter-spacing: .08em; }
.mic.on { background: rgba(217,192,142,.18); }
.mic.rec { background: #a94a3a; border-color: #a94a3a; animation: pulse 1.2s infinite; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="room">
  <div class="stage" id="stage">
    <video class="idle" id="vIdle" src="../avatar/idle.mp4" poster="../avatar/idle.jpg" muted loop autoplay playsinline preload="auto" aria-hidden="true"></video>
    <video class="talk" id="vTalk" src="../avatar/talk.mp4" muted loop playsinline preload="auto" aria-label="王大明先生的數字人影像"></video>
    <video class="bow" id="vBow" src="../avatar/bow.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="cap" id="cap" aria-live="polite"></div>
    <button type="button" class="fs" id="fsBtn"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全螢幕</span></button>
    <button type="button" class="fs pres" id="presBtn" hidden aria-pressed="true" title="鏡頭只在這台裝置上判斷有沒有人靠近，不錄影、不上傳"><i></i><span>等候親人</span></button>
    <button type="button" class="fs vbtn" id="voiceBtn" hidden><svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg><span>聲音</span></button>
  </div>
  <div class="side" id="side">
    <span class="eyebrow">TALK WITH HIM</span>
    <h1>和他說說話</h1>
    <p class="lead">直接開口跟他說話就好。他說完，會再聽你說。</p>
    <div class="chips" id="chips"></div>
    <button type="button" class="more" id="moreChips" hidden>更多話題</button>
    <div class="status"><p class="you" id="you" aria-live="polite"></p><button class="btn ghost" type="button" id="vStop" hidden>停止</button></div>
    <p class="note">此為依照片與家人回憶製作的 AI 數字人，回答是家人事先寫好的話，聲音為合成語音。</p>
  </div>
</div>
<button type="button" class="veil" id="veil" hidden><i><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></i><b>輕觸畫面，和他說說話</b><span>請允許使用麥克風</span></button>
<div class="vpanel" id="vPanel" hidden role="dialog" aria-modal="true" aria-labelledby="vPanelTitle"><div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 id="vPanelTitle">選擇他的聲音</h2><button class="btn ghost" type="button" id="vClose">完成</button></div>
  <div id="vList"></div>
  <p class="note">這些是預設的 AI 合成聲音，不是他生前的原聲。</p>
</div></div>
<audio id="vSample" preload="none"></audio>
<audio id="vAudio" preload="auto"></audio>
<script>
// Prepared answers in his voice. Idle loop at rest, talk loop while a clip plays, bow after some answers.
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), idle = $('vIdle'), talk = $('vTalk'), bow = $('vBow'), audio = $('vAudio'), cap = $('cap');
  const side = $('side'), stopBtn = $('vStop'), fsBtn = $('fsBtn');
  const chips = $('chips'), moreBtn = $('moreChips'), you = $('you');
  let qa = [], caps = [], state = 'idle', withBow = false, fb = 0;

  // Settings, voices and answers come from config.json, written by the admin tool on publish.
  // Without it (older deploy) the page keeps working with the original single voice.
  let site = { handsFree: true, showCaptions: true, chipsShown: 10, greetingId: 'hello', speed: 1, volume: 1, bowAfter: true,
    presence: { enabled: false, greetId: 'hello', byeId: 'bye', near: 0.08, leaveSec: 8 } };
  let voices = [], voice = null, capsByVoice = {};
  const VKEY = 'memorial-talk-voice';
  const clipUrl = id => voice ? `../avatar/voices/${voice}/qa/${id}.mp3` : `../avatar/qa/${id}.mp3`;
  const loadCaps = v => capsByVoice[v] ? Promise.resolve(capsByVoice[v]) : fetch(`../avatar/voices/${v}/caps.json`).then(r => r.json()).then(j => (capsByVoice[v] = j));
  const ready = fetch('../config.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(async c => {
    Object.assign(site, c.site, { presence: { ...site.presence, ...(c.site && c.site.presence) } }); voices = c.voices; qa = c.qa;
    let pick = new URLSearchParams(location.search).get('v');
    if (!pick && site.allowVoicePick) try { pick = localStorage.getItem(VKEY); } catch {}
    voice = voices.some(x => x.id === pick) ? pick : c.defaultVoice;
    await loadCaps(voice);
    if (site.title) { document.title = site.title; document.querySelector('h1').textContent = site.title; }
    if (site.lead) document.querySelector('.lead').textContent = site.lead;
    if (site.note) document.querySelector('.note').textContent = site.note;
    $('voiceBtn').hidden = !(site.allowVoicePick && voices.length > 1);
  }).catch(() => fetch('../avatar/qa.json').then(r => r.json()).then(j => { qa = j; voice = null; }))
    .then(renderChips).catch(() => { you.textContent = '回答載入失敗，請重新整理。'; });

  let afterBow = null, byeQueued = false, greetQueued = false;
  const rest = () => {
    if (afterBow) { const f = afterBow; afterBow = null; state = 'idle'; stage.classList.remove('bowing'); bow.pause(); f(); return; }
    state = 'idle'; stage.classList.remove('bowing', 'speaking'); idle.play().catch(() => {}); side.classList.remove('busy');
    talk.pause(); talk.currentTime = 0; bow.pause(); bow.currentTime = 0;
    cap.classList.remove('on'); stopBtn.hidden = true;
    if (byeQueued) { byeQueued = false; setTimeout(sayBye, 300); return; }
    if (greetQueued) { greetQueued = false; if (present) { setTimeout(greetArrival, 300); return; } }
    if (handsFree) setTimeout(listen, 700);
  };
  // Bow with folded hands (拱手) on its own, then go on with `then`
  const bowNow = then => {
    if (rec) rec.abort();
    afterBow = then || null; state = 'bowing'; side.classList.add('busy'); cap.classList.remove('on');
    bow.currentTime = 0; stage.classList.remove('speaking'); stage.classList.add('bowing');
    bow.play().catch(rest);
  };
  stopBtn.addEventListener('click', () => { audio.pause(); afterBow = null; byeQueued = greetQueued = false; rest(); });
  audio.addEventListener('timeupdate', () => {
    if (state !== 'talking') return;
    const t = audio.currentTime;
    const c = caps.find(x => t >= x.s && t < x.e + .25);
    if (c && site.showCaptions !== false) { if (cap.textContent !== c.t) cap.textContent = c.t; cap.classList.add('on'); } else cap.classList.remove('on');
  });
  audio.addEventListener('ended', () => {
    if (!withBow) { rest(); return; }
    state = 'bowing'; cap.classList.remove('on');
    bow.currentTime = 0; stage.classList.remove('speaking'); stage.classList.add('bowing');
    bow.play().catch(rest); setTimeout(() => talk.pause(), 400);
  });
  bow.addEventListener('ended', rest);

  // Pick the closest prepared answer by keywords, else a gentle catch-all
  const norm = s => s.replace(/[\s，。！？、,.!?~～…「」『』"'：:；;（）()／/]/g, '');
  function match(text) {
    const t = norm(text);
    let best = null, top = 0;
    for (const it of qa) {
      if (it.fallback) continue;
      let s = 0;
      for (const k of it.keys) if (t.includes(k)) s += k.length * 2 + 1;
      const pool = it.chip + it.keys.join('');
      for (let i = 0; i < t.length - 1; i++) if (pool.includes(t.slice(i, i + 2))) s += 1;
      if (s > top) { top = s; best = it; }
    }
    if (top >= 2) return best;
    const fbs = qa.filter(x => x.fallback);
    return fbs[fb++ % fbs.length];
  }
  function answer(text, it) {
    if (!it || state !== 'idle') return;
    if (rec) rec.abort();   // never listen while he speaks
    you.textContent = '你說：' + text;
    audio.src = clipUrl(it.id);
    audio.defaultPlaybackRate = audio.playbackRate = site.speed || 1; audio.volume = Math.min(1, site.volume || 1);
    caps = (voice ? capsByVoice[voice][it.id] : it.caps) || []; withBow = !!it.bow && site.bowAfter !== false;
    state = 'talking'; side.classList.add('busy'); stopBtn.hidden = false;
    talk.currentTime = 0; stage.classList.add('speaking');
    audio.play().catch(rest); talk.play().catch(() => {});
  }
  function renderChips() {
    const list = qa.filter(x => x.chip), shown = site.chipsShown ?? 10;
    list.forEach((it, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = it.chip; b.hidden = i >= shown;
      b.addEventListener('click', () => answer(it.chip, it));
      chips.append(b);
    });
    if (list.length > shown) moreBtn.hidden = false;
  }
  moreBtn.addEventListener('click', () => { chips.querySelectorAll('button').forEach(b => { b.hidden = false; }); moreBtn.hidden = true; });

  // Voice only: he listens whenever he is quiet (and someone is there), answers, then listens again.
  // Without speech recognition or with the mic refused, the topic chips still work.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, handsFree = false, noMic = !SR;
  function listen() {
    if (!handsFree || rec || state !== 'idle' || noMic || !$('vPanel').hidden || (watching && !present)) return;
    rec = new SR(); rec.lang = 'zh-TW'; rec.interimResults = true;
    let heard = '';
    rec.onresult = e => { heard = Array.from(e.results, r => r[0].transcript).join(''); you.textContent = '你說：' + heard; };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { noMic = true; you.textContent = '麥克風沒有開啟權限，請在瀏覽器設定允許使用麥克風。'; }
    };
    rec.onend = () => {
      rec = null;
      const text = heard.trim();
      if (text && qa.length) answer(text, match(text));
      else if (handsFree) setTimeout(listen, 300);   // silence: keep listening
    };
    you.textContent = '我在聽，你說…';
    try { rec.start(); } catch { rec = null; }
  }

  // Start: greet, then listen. Browsers that block sound until a tap get one tap on the veil.
  const veil = $('veil');
  const greet = () => {
    handsFree = !noMic;
    if (site.presence.enabled) { startWatching(); return; }
    const hi = site.greetingId && qa.find(x => x.id === site.greetingId);
    if (hi) { answer('（開始）', hi); you.textContent = ''; } else if (handsFree) listen();
  };

  // Presence: the device's own camera notices a face coming close (greet with folded hands)
  // and its absence after a while (farewell with folded hands). Frames never leave the device.
  const presBtn = $('presBtn'), presLabel = presBtn.querySelector('span');
  let watching = false, present = false, nearSince = 0, lastSeen = 0, cam = null, detector = null, timer = 0;
  const qaById = id => id && qa.find(x => x.id === id);
  const showPres = () => {
    presBtn.classList.toggle('seen', watching && present); presBtn.classList.toggle('off', !watching);
    presBtn.setAttribute('aria-pressed', watching);
    presLabel.textContent = !watching ? '靠近偵測已關' : present ? '看見你了' : '等候親人';
  };
  // Every new arrival gets the folded-hands bow and greeting, even right after the last goodbye;
  // if he is still busy (say, bowing farewell to the one before), it waits until he is free.
  function arrive() {
    present = true; showPres();
    if (state === 'idle') greetArrival(); else greetQueued = true;
  }
  function greetArrival() {
    if (!present || state !== 'idle') return;
    const hi = qaById(site.presence.greetId);
    bowNow(() => { if (hi) { answer('（有人靠近）', { ...hi, bow: false }); you.textContent = ''; } else rest(); });
  }
  function sayBye() {
    if (present || state !== 'idle') return;
    const bye = qaById(site.presence.byeId);
    if (bye) { answer('（親人離開）', { ...bye, bow: true }); you.textContent = ''; } else bowNow();
  }
  function leave() {
    present = false; greetQueued = false; showPres();
    if (rec) rec.abort();
    if (state === 'idle') sayBye(); else byeQueued = true;
  }
  function tick() {
    if (!watching || !detector || cam.readyState < 2) return;
    const now = performance.now();
    let faces = [];
    try { faces = detector.detectForVideo(cam, now).detections; } catch { return; }
    const w = cam.videoWidth || 1;
    const near = faces.some(f => f.boundingBox.width / w >= site.presence.near);
    if (faces.length) lastSeen = now;
    if (near) { nearSince = nearSince || now; if (!present && now - nearSince > 700) arrive(); }
    else nearSince = 0;
    if (present && now - lastSeen > site.presence.leaveSec * 1000) leave();
  }
  async function startWatching() {
    presBtn.hidden = false; you.textContent = '正在開啟鏡頭…';
    try {
      cam = document.createElement('video'); cam.muted = true; cam.playsInline = true;
      cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
      await cam.play();
      const V = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      const files = await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      detector = await V.FaceDetector.createFromOptions(files, { runningMode: 'VIDEO', minDetectionConfidence: 0.6,
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' } });
      watching = true; showPres(); you.textContent = '';
      timer = setInterval(tick, 200);
    } catch (e) {
      // No camera or detector: fall back to the plain greeting and listening
      stopWatching(); presBtn.hidden = true; you.textContent = '';
      const hi = qaById(site.greetingId);
      if (hi) answer('（開始）', hi); else if (handsFree) listen();
      you.textContent = '';
    }
  }
  function stopWatching() {
    watching = false; present = false; clearInterval(timer);
    if (cam && cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    showPres();
  }
  presBtn.addEventListener('click', () => {
    if (watching) { stopWatching(); if (handsFree && state === 'idle') listen(); }
    else { if (rec) rec.abort(); startWatching(); }
  });
  if (new URLSearchParams(location.search).has('debug')) window.__presence = { arrive, leave, state: () => ({ watching, present, state }) };

  // Voice picker: visitors choose among the voices the family opened; the choice is remembered on this device
  const vPanel = $('vPanel'), vList = $('vList'), sample = $('vSample');
  const renderVoices = () => {
    vList.replaceChildren();
    for (const g of ['男', '女']) {
      const vs = voices.filter(x => x.gender === g);
      if (!vs.length) continue;
      const h = document.createElement('h3'); h.textContent = g + '聲'; vList.append(h);
      for (const x of vs) {
        const row = document.createElement('div'); row.className = 'vopt' + (x.id === voice ? ' cur' : '');
        const t = document.createElement('div'); const b = document.createElement('b'); b.textContent = x.name; const s = document.createElement('small'); s.textContent = x.desc; t.append(b, s);
        const hear = document.createElement('button'); hear.type = 'button'; hear.className = 'btn ghost'; hear.textContent = '試聽';
        hear.onclick = () => { sample.src = `../avatar/voices/${x.id}/sample.mp3`; sample.play().catch(() => {}); };
        const use = document.createElement('button'); use.type = 'button'; use.className = 'btn' + (x.id === voice ? '' : ' ghost'); use.textContent = x.id === voice ? '使用中' : '選用';
        use.onclick = async () => {
          await loadCaps(x.id).catch(() => null); if (!capsByVoice[x.id]) return;
          voice = x.id; try { localStorage.setItem(VKEY, voice); } catch {}
          renderVoices();
        };
        row.append(t, hear, use); vList.append(row);
      }
    }
  };
  $('voiceBtn').addEventListener('click', () => {
    if (state !== 'idle') { audio.pause(); rest(); }
    if (rec) rec.abort();
    renderVoices(); vPanel.hidden = false; $('vClose').focus();
  });
  const closeVoices = () => { vPanel.hidden = true; sample.pause(); if (handsFree) listen(); };
  $('vClose').addEventListener('click', closeVoices);
  vPanel.addEventListener('click', e => { if (e.target === vPanel) closeVoices(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !vPanel.hidden) closeVoices(); });
  const soundAllowed = () => {
    if (navigator.getAutoplayPolicy) return navigator.getAutoplayPolicy('mediaelement') === 'allowed';
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const c = new AC(), ok = c.state === 'running'; c.close(); return ok;
  };
  ready.then(() => { if (soundAllowed()) greet(); else veil.hidden = false; });
  veil.addEventListener('click', () => { veil.hidden = true; greet(); });

  // Full screen
  const label = fsBtn.querySelector('span');
  new ResizeObserver(() => document.body.style.setProperty('--panel', side.offsetHeight + 'px')).observe(side);
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => { label.textContent = document.fullscreenElement ? '離開全螢幕' : '全螢幕'; });
  if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
})();
</script>
</body>
</html>
